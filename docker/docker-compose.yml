services:
  microservice:
    image: ghcr.io/bozonx/page-scraper-microservice:${TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: page-scraper-microservice
    hostname: page-scraper-microservice
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    shm_size: 1gb
    ports:
      - '${LISTEN_PORT:-8080}:8080'
    env_file:
      - ../.env
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
    tmpfs:
      - /tmp:size=512m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const b=(process.env.BASE_PATH||'').replace(/^\\/+|\\/+$/g,'');const p='/'+(b?b+'/':'')+'api/v1/health';require('http').get('http://127.0.0.1:8080'+p,r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
