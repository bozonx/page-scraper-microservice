name: Security

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  schedule:
    # Advisories appear after a commit lands, so re-check on a schedule too.
    - cron: '0 6 * * 1'

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Blocking: a critical advisory must not reach the default branch.
      - name: Audit (critical blocks the build)
        run: pnpm audit --audit-level=critical

      # Informational: high findings are mostly dev tooling, so they are reported, not enforced.
      - name: Audit (high, informational)
        run: pnpm audit --audit-level=high || true

      - name: Audit production dependencies only
        run: pnpm audit --prod --audit-level=high
